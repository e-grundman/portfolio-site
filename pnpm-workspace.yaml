# sharp converts the share cards to JPEG in lib/og.tsx. Its install script only
# compiles from source as a fallback; the prebuilt @img/sharp-* binaries arrive
# as optional dependencies, so skipping the script is safe here and on Vercel.
# pnpm 11 fails the install on an unresolved build script, so declare it here
# rather than leaving it merely ignored.
#
# esbuild is vitest's transform step and does need its native binary, so it is
# allowed rather than skipped.
allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true
